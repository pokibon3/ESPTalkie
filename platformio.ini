[platformio]
default_envs = m5stack-sticks3
;default_envs = m5stack-atoms3-echo-base
;default_envs = m5stack-papercolor
;default_envs = m5stack-stopwatch

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DTARGET_M5STICKS3
lib_deps =
    m5stack/M5Unified@0.2.13
    m5stack/M5PM1@1.0.4

[env:m5stack-papercolor]
platform = espressif32@6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.embed_files =
    assets/pokibon-transfer.png
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DTARGET_M5PAPERCOLOR
lib_deps =
    m5stack/M5Unified@0.2.15
    m5stack/M5PM1@1.0.4

[env:m5stack-atoms3-echo-base]
platform = espressif32@6.12.0
board = m5stack-atoms3
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DTARGET_M5ATOMS3_ECHO_BASE
lib_deps =
    m5stack/M5Unified@0.2.13
    m5stack/M5PM1@1.0.4

; M5Stack StopWatch (ESP32-S3R8, 16MB flash, 8MB OPI PSRAM, 466x466 AMOLED)
[env:m5stack-stopwatch]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.embed_files =
    assets/stopwatch-dog.jpg
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DTARGET_M5STOPWATCH
lib_deps =
    m5stack/M5Unified@0.2.23
    m5stack/M5PM1@1.0.4

; M5Stack Tab5 (ESP32-P4 + ESP32-C6 co-processor)
; Needs pioarduino (Arduino core 3.x / ESP-IDF 5.5). ESP-NOW runs on the C6 via
; esp-hosted CustomRpc (lib/esp_now_hosted + assets/c6 firmware).
[env:m5stack-tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
board_build.partitions = default_16MB.csv
board_build.embed_files =
    assets/c6/network_adapter_esp32c6.bin
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DTARGET_M5TAB5
    -I src
lib_deps =
    https://github.com/m5stack/M5Unified.git
